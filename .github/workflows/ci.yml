name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            packages: ./internal/api
          - name: runtime-session
            packages: ./internal/runtime ./internal/session
          - name: provider
            packages: ./internal/provider
          - name: command
            packages: ./cmd/...
            test_args: -v -timeout=90s
          - name: client-config
            packages: ./internal/client ./internal/config
          - name: migrate-paths
            packages: ./internal/migrate ./internal/paths
          - name: support
            packages: ./internal/daemon ./internal/integrationtest/...
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-enabled tests
        run: go test -race ${{ matrix.test_args }} ${{ matrix.packages }}

  vet:
    name: Go vet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  integration:
    name: Process contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./integration

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:sites
